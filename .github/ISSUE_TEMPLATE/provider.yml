name: Add or update a provider
description: Submit a free AI API provider or correct provider metadata
title: "provider: "
labels: [provider-data]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Provider name.
    validations:
      required: true
  - type: input
    id: signup
    attributes:
      label: Signup/API key page
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Primary evidence URL
      description: Official page proving the current $0 access path.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Free access details
      description: State whether login, API key, card, or identity verification is required and what the quota is.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Checklist
      options:
        - label: I did not include any secret/API key.
          required: true
        - label: I checked that this is an API, not only a web chat UI.
          required: true
